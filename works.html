    <h2>Portfolio</h2>
  </div>
  <div class="grid">
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/works-1.svg" data-title="Entrapment" data-desc="This piece sheds light on the struggles of Asian restaurant workers, inviting viewers to recognize the humanity behind their services often taken for granted. Immigrants often cannot receive a proper education or move up the social mobility ladder. Due to these financial or language barriers, many are stuck working at restaurants and compelled to prepare Asian food tailored to American tastes. The fish tank symbolizes invisible entrapment, a confined space where the workers are submerged in the endless demand and monotony of their labor, disconnected from opportunities outside. The two waitresses, dressed in traditional garments, represent the clash between cultural pride and the sacrifices they make to survive. The floating receipts in the background evoke the commodification of their efforts, reducing their identity to the food they serve.">
      <div class="piece-thumb"><img src="images/Entrapment.jpg" alt="Entrapment"></div>
      <h3>Entrapment</h3>
      <p>Oil on Canvas</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/works-2.svg" data-title="Field Study I" data-desc="The first in an ongoing series of field studies, painted from a photo I took on a walk near my parents' place. I kept the palette almost entirely blues and purples to see how far I could push it before it stopped looking like a field.">
      <div class="piece-thumb"><img src="images/works-2.svg" alt="Field Study I"></div>
      <h3>Field Study I</h3>
      <p>acrylic, 16×20</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/works-3.svg" data-title="Paper Weather" data-desc="Torn paper, gouache, and a little bit of thread. This piece started as a mistake — I spilled water on a sketch and liked the bloom it left, so I built the whole piece around chasing that effect again.">
      <div class="piece-thumb"><img src="images/works-3.svg" alt="Paper Weather"></div>
      <h3>Paper Weather</h3>
      <p>mixed media</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/works-4.svg" data-title="Small Blue Hour" data-desc="A quick ten-minute watercolor, the kind I do most evenings to warm up. This one just happened to come out better than most, so it earned a frame.">
      <div class="piece-thumb"><img src="images/works-4.svg" alt="Small Blue Hour"></div>
      <h3>Small Blue Hour</h3>
      <p>watercolor</p>
    </div>
  </div>
