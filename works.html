  <div class="grid">
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/Entrapment.jpg" data-title="Entrapment" data-desc="This piece sheds light on the struggles of Asian restaurant workers, inviting viewers to recognize the humanity behind their services often taken for granted. Immigrants often cannot receive a proper education or move up the social mobility ladder. Due to these financial or language barriers, many are stuck working at restaurants and compelled to prepare Asian food tailored to American tastes. The fish tank symbolizes invisible entrapment, a confined space where the workers are submerged in the endless demand and monotony of their labor, disconnected from opportunities outside. The two waitresses, dressed in traditional garments, represent the clash between cultural pride and the sacrifices they make to survive. The floating receipts in the background evoke the commodification of their efforts, reducing their identity to the food they serve.">
      <div class="piece-thumb"><img src="images/Entrapment.jpg" alt="Entrapment"></div>
      <h3>Entrapment</h3>
      <p>Digital Art</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/Rescue.svg" data-title="Rescue" data-desc="This piece is a homage to Bodega Bay, a longtime refuge from the sweltering summer heat and source of cherished memories with friends. However, the sands now tell a different story. Dungeness crabs are dying off in alarming numbers due to hypoxia, ocean acidification, harmful algal blooms, and marine heatwaves—stressors worsened by climate change. In this piece, I depict a group of friends biking along the shore and rescuing these crabs. The composition’s first-person perspective draws the viewer into the scene, asking: what is your role in the preservation of these fragile ecosystems?">
      <div class="piece-thumb"><img src="images/Rescue.jpg" alt="Rescue"></div>
      <h3>Rescue</h3>
      <p>Digital Art</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/MusicalChairs.jpg" data-title="Musical Chairs" data-desc="It suddenly occurred to me, when I was beaten to a spot in a round of Musical Chairs, that this popular game greatly resembled life. The chairs symbolize opportunities that society frames as scarce and finite; their metallic surfaces and contrast bold colors emphasize their allure and the competitive tension. The dynamic composition, with limbs and chairs intertwining, and the vibrant and textured background, contribute to the chaos of a fiery, high-stakes environment.
However, I want to emphasize the fun of the game beyond the competition. I composed game participants as different versions of myself, illustrating that everyone will encounter both triumphs and setbacks in their lifetime. Additionally, this piece invites viewers to question systems that frame success as a zero-sum game, raising the need to reimagine competition as collaboration, and recognize the humanity behind each individual’s pursuit of her dreams.">
      <div class="piece-thumb"><img src="images/MusicalChairs.jpg" alt="Musical Chairs"></div>
      <h3>Musical Chairs</h3>
      <p>Digital Art</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/APleaforStudentSafety.jpg" data-title="A Plea for Student Safety" data-desc="This painting reflects the pervasive issue of school violence that continues to haunt students across the nation. It is rooted in a deeply personal experience: a walkout following the death due to the stabbing of a 16-year-old student at a nearby high school, and a subsequent weapon threat at my own school. Our handmade signs—crafted from meter sticks and poster paper—may seem humble, but their messages were powerful, resonating with millions who share our call for safety. I experimented with neon colors juxtaposed against a monochromatic background to emphasize the urgency of this issue. I also used collage style and varying degrees of opacity to symbolize the convergence of distinct voices into one unanimous plea: keep us safe.">
      <div class="piece-thumb"><img src="images/APleaforStudentSafety.jpg" alt="A Plea for Student Safety"></div>
      <h3>A Plea for Student Safety</h3>
      <p>Acrylic on Canvas</p>
    </div>
    <div class="piece" role="button" tabindex="0" aria-haspopup="dialog"
         data-img="images/UnionsandIntersections.jpg" data-title="Unions and Intersections" data-desc="This piece was inspired by a snapshot at my summer camp where everyone was equally curious and passionate about mathematics and had something different to contribute. I wanted to reflect the collaborative nature: having multiple minds inspiring each other and bearing the fruit as a team. The multicolored abstractions on the table are math visualizations, which I chose to emphasize more than the human figures to reveal that the output of cooperative work is often more significant than individual effort, through the display of a highly vibrant color scheme.">
      <h3>Unions and Intersections</h3>
      <p>Colored pencil, Micron Pen</p>
    </div>
